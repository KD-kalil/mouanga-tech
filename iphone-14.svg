<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Illustration du téléphone iPhone 14 violet</title>
  <desc id="desc">Illustration originale des faces avant et arrière d'un téléphone violet. Ce n'est pas une photo du produit en vente.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e7edf5"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e2d8ff"/>
      <stop offset="1" stop-color="#8d7abf"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c5e8ff"/>
      <stop offset=".5" stop-color="#7468d7"/>
      <stop offset="1" stop-color="#242b61"/>
    </linearGradient>
    <filter id="shadow" x="-.3" y="-.2" width="1.7" height="1.6">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#27334a" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="720" height="900" rx="38" fill="url(#background)"/>
  <circle cx="116" cy="180" r="88" fill="#fff" opacity=".6"/>
  <ellipse cx="360" cy="746" rx="244" ry="36" fill="#9aa7ba" opacity=".22"/>
  <g filter="url(#shadow)" transform="rotate(-8 355 445)">
    <rect x="139" y="194" width="266" height="500" rx="40" fill="#262b34"/>
    <rect x="146" y="201" width="252" height="486" rx="34" fill="url(#purple)"/>
    <rect x="158" y="213" width="105" height="109" rx="25" fill="#c5b7ed"/>
    <circle cx="188" cy="247" r="21" fill="#151923" stroke="#4d5264" stroke-width="5"/>
    <circle cx="231" cy="287" r="21" fill="#151923" stroke="#4d5264" stroke-width="5"/>
    <circle cx="236" cy="239" r="8" fill="#f6edda"/>
    <circle cx="267" cy="449" r="36" fill="#fff" opacity=".18"/>
    <rect x="422" y="194" width="266" height="500" rx="40" fill="#242832"/>
    <rect x="430" y="202" width="250" height="484" rx="34" fill="#101620"/>
    <rect x="440" y="212" width="230" height="464" rx="27" fill="url(#screen)"/>
    <circle cx="486" cy="364" r="115" fill="#a5d9ff" opacity=".4"/>
    <circle cx="612" cy="511" r="142" fill="#bea6ff" opacity=".5"/>
    <path d="M440 545c68-82 148-37 230-111v198H440z" fill="#293066" opacity=".58"/>
    <rect x="512" y="214" width="86" height="18" rx="9" fill="#101620"/>
  </g>
  <rect x="194" y="768" width="332" height="44" rx="22" fill="#fff" opacity=".84"/>
  <text x="360" y="797" text-anchor="middle" fill="#354054" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">ILLUSTRATION DU MODÈLE</text>
</svg>
